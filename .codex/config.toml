#:schema https://developers.openai.com/codex/config-schema.json

# Keep routine research autonomous but confine writes to this workspace.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# AGENTS.md stays small, while linked detail remains in .agents/.
project_doc_max_bytes = 16384
project_root_markers = [".git", "AGENTS.md"]

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
