[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-data-tools"
version = "0.1.0"
description = "VLA dataset inspection and canonical format conversion tools"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11,<3.15",
  "huggingface_hub>=0.25",
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
rlds = [
  "tensorflow[and-cuda]>=2.16,<2.22",
  "tensorflow-datasets>=4.9,<5",
]
dev = ["pytest>=8"]

[project.scripts]
vla-data-tools = "vla_data_tools.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
